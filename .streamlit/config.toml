[theme]
base = "dark"
primaryColor = "#E8C978"
backgroundColor = "#000000"
secondaryBackgroundColor = "#191919"
textColor = "#FAFAF8"
font = "sans serif"

[client]
showErrorDetails = "none"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = true

[browser]
gatherUsageStats = false
