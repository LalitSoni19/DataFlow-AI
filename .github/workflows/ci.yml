name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke test installed wheel
        run: |
          python -m pip wheel --no-deps -w /tmp/dataflow-wheel .
          python -m pip install --no-deps --force-reinstall /tmp/dataflow-wheel/*.whl
          cd "$(mktemp -d)"
          python -c "from dataflow_ai.settings import Settings; from dataflow_ai.pipeline import PipelineRunner; assert PipelineRunner(Settings.from_environment()).run_sample_pipeline().status == 'completed'"
