[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-ai"
version = "0.1.0"
description = "A local-first AI-powered data engineering portfolio platform"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.39,<2",
  "pydantic>=2.7,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=15,<24",
  "sqlglot>=26,<29",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
orchestration = ["apache-airflow>=3.0,<4"]
dbt = ["dbt-duckdb>=1.8,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider --basetemp=data/test_tmp"
